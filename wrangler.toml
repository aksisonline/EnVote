name = "envote-app"
main = "src/worker.ts"
compatibility_date = "2024-01-15"

[env.production]
name = "envote-app"

[[d1_databases]]
binding = "DB"
database_name = "envote-db"
database_id = "d4ccf2e5-600d-49b5-bf77-35c3dc0d1064"

[durable_objects]
bindings = [
  { name = "REALTIME", class_name = "RealtimeHandler" }
]

[[migrations]]
tag = "v1"
new_classes = ["RealtimeHandler"]
